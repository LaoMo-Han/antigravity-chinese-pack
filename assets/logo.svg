<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#9B72CF"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#1e1e2e" stroke="url(#grad)" stroke-width="3" />
  
  <!-- Orbit Ring -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#orbit)" stroke-width="2.5" transform="rotate(-28 64 64)" stroke-dasharray="6 3"/>
  <circle cx="24" cy="46" r="4.5" fill="#34A853"/>
  <circle cx="104" cy="82" r="3.5" fill="#FBBC05"/>

  <!-- Stylized Chinese character '汉' / Localization icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left 3 dots water -->
    <path d="M 38 48 Q 44 46 42 52" />
    <path d="M 36 60 Q 42 62 39 68" />
    <path d="M 35 84 L 46 72" />
    
    <!-- Right You -->
    <!-- Hengpie -->
    <path d="M 52 48 L 86 48 L 68 64" />
    <!-- Na -->
    <path d="M 58 60 Q 64 74 92 84" />
    <!-- Pie -->
    <path d="M 76 56 Q 64 72 50 84" />
  </g>
</svg>
